[package]
name = "migas"
version = "0.2.5"
description = "Diario de enlaces y notas con seguimiento de cambios"
authors = ["carlos-anpr"]
license = "MIT"
edition = "2024"

[lib]
name = "migas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "migas"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Dependencias CERRADAS: ningún agente añade ni cambia versiones sin pedírselo al líder.
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "fs", "sync"] }
futures = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "6"
rusqlite = { version = "0.41", features = ["bundled"] }
url = "2"
evdev = "0.13"

[dev-dependencies]
httpmock = "0.8"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
